<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth</title>
    <style>
        :root { --primary: #2563eb; --success: #10b981; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #1e293b; margin: 0; padding: 30px 15px; display: flex; justify-content: center; align-items: center; min-height: 85vh; box-sizing: border-box; }
        
        .auth-box { width: 100%; max-width: 300px; background: var(--card); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 24px; box-sizing: border-box; }
        .auth-box input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; text-align: center; letter-spacing: 3px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .auth-box input:focus { border-color: var(--primary); }
        .auth-box input.error { border-color: #ef4444; animation: shake 0.3s; }
        .auth-box button { width: 100%; margin-top: 14px; padding: 11px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .container { width: 100%; max-width: 540px; background: var(--card); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 28px; box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; }
        .desc { font-size: 13px; color: #64748b; margin-bottom: 22px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
        input.form-input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; transition: border 0.2s; }
        input.form-input:focus { border-color: var(--primary); }
        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }
        
        .icon-upload-card { border: 2px dashed #cbd5e1; background: #f8fafc; border-radius: 10px; padding: 16px; display: flex; align-items: center; gap: 16px; transition: border-color 0.2s; }
        .icon-upload-card:hover { border-color: var(--primary); }
        .icon-preview { width: 64px; height: 64px; border-radius: 12px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 12px; color: #64748b; border: 1px solid #cbd5e1; flex-shrink: 0; }
        .icon-preview img { width: 100%; height: 100%; object-fit: cover; }
        
        .btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; margin-top: 8px; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-card { display: none; margin-top: 22px; padding: 18px; border-radius: 12px; background: #f1f5f9; border: 1px solid #e2e8f0; }
        .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin: 12px 0; }
        .progress-fill { height: 100%; width: 5%; background: var(--primary); transition: width 0.5s ease; }
        .step-list { font-size: 13px; color: #475569; margin: 10px 0 0 0; padding-left: 18px; line-height: 1.7; }
        .download-btn { display: none; width: 100%; text-align: center; padding: 13px; background: var(--success); color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; margin-top: 14px; box-sizing: border-box; cursor: pointer; font-size: 15px; border: none; }
        .download-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .backup-link { display: none; margin-top: 10px; text-align: center; font-size: 13px; }
        .backup-link a { color: var(--primary); text-decoration: underline; cursor: pointer; }
        details { margin-bottom: 18px; background: #f8fafc; padding: 10px 14px; border-radius: 8px; border: 1px solid #e2e8f0; }
        summary { font-size: 13px; font-weight: 600; cursor: pointer; color: #475569; }
        .hint { font-size: 12px; color: #64748b; margin-top: 6px; line-height: 1.4; }
    </style>
</head>
<body>

<div id="appRoot" style="width: 100%; display: flex; justify-content: center;">
    <div class="auth-box">
        <input type="password" id="pwdInput" autocomplete="off" autofocus onkeydown="if(event.key==='Enter') verifyAccess()">
        <button onclick="verifyAccess()">↵</button>
    </div>
</div>

<script>
    function getTodayCode() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}${m}${d}`;
    }

    function verifyAccess() {
        const inputEl = document.getElementById('pwdInput');
        if (!inputEl) return;
        
        if (inputEl.value.trim() === getTodayCode()) {
            renderMainApp();
        } else {
            inputEl.classList.remove('error');
            void inputEl.offsetWidth;
            inputEl.classList.add('error');
            inputEl.value = '';
        }
    }

    let globalPureBase64 = '';
    let currentReleaseId = null;
    let currentTagName = null;
    let rawDownloadUrl = '';
    let targetAssetId = null;

    function renderMainApp() {
        document.title = 'Web轉APK 雲端線上打包平台';
        document.body.style.alignItems = 'flex-start';
        const root = document.getElementById('appRoot');
        root.innerHTML = `
        <div class="container">
            <h2>📱 網頁轉 APK 雲端線上打包台</h2>
            <p class="desc">輸入目標網址、應用名稱與上傳圖標，點擊下載後將自動銷毀雲端記錄。</p>

            <details id="config-panel">
                <summary>⚙️ 首次使用配置 (GitHub 倉庫與 Token，自動保存在本地瀏覽器)</summary>
                <div style="margin-top: 12px;">
                    <div class="row">
                        <div class="form-group">
                            <label>GitHub 用戶名</label>
                            <input type="text" class="form-input" id="owner" placeholder="例如: zhangsan">
                        </div>
                        <div class="form-group">
                            <label>倉庫名稱 (Repo)</label>
                            <input type="text" class="form-input" id="repo" placeholder="例如: my-web-apk">
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>GitHub Personal Access Token (需勾選 workflow 與 repo 權限)</label>
                        <input type="password" class="form-input" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                        <div class="hint">Token 僅保存在你當前瀏覽器的 localStorage 中。</div>
                    </div>
                </div>
            </details>

            <div class="form-group">
                <label>🖼️ 上傳 App 桌面圖標 (Icon)</label>
                <div class="icon-upload-card">
                    <div class="icon-preview" id="iconPreview">預覽</div>
                    <div style="flex: 1;">
                        <input type="file" id="iconFile" accept="image/png, image/jpeg" onchange="handleIconUpload(this)">
                        <div class="hint">支持任意大小 PNG / JPG 圖片，不上傳則使用安卓默認圖標。</div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>🌐 目標網站地址 (必填，需帶 http:// 或 https://)</label>
                <input type="url" class="form-input" id="targetUrl" placeholder="https://www.example.com" value="https://www.bing.com">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>🏷️ 手機桌面顯示的 App 名稱</label>
                    <input type="text" class="form-input" id="appName" placeholder="例如：我的商城" value="我的應用">
                </div>
                <div class="form-group">
                    <label>📦 唯一英文標識 (防覆蓋安裝)</label>
                    <input type="text" class="form-input" id="appSuffix" placeholder="純字母，如 shopapp" value="myapp01">
                </div>
            </div>

            <div class="form-group">
                <label>💾 自定義下載 APK 文件名 (支持中文，留空則自動使用應用名稱命名)</label>
                <input type="text" class="form-input" id="customFileName" placeholder="例如：我的內部商城 (無需加 .apk)">
            </div>

            <button id="buildBtn" class="btn" onclick="startBuild()">🚀 開始雲端編譯 APK</button>

            <div id="statusCard" class="status-card">
                <div id="statusTitle" style="font-weight: 600; font-size: 14px;">正在請求雲端構建服務器...</div>
                <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
                <ul id="stepList" class="step-list"></ul>
                <!-- 使用 API 二進制流下載，解決跨域及自定義命名問題 -->
                <button id="downloadBtn" class="download-btn" onclick="executeBlobDownload()">⬇️ 立即下載編譯好的 APK</button>
                <div id="backupLink" class="backup-link">
                    <a id="backupA" target="_blank" rel="noopener noreferrer">點此直接打開 Releases 下載列表</a>
                </div>
            </div>
        </div>`;

        initSavedConfig();
    }

    function handleIconUpload(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const fullDataUrl = e.target.result;
                document.getElementById('iconPreview').innerHTML = `<img src="${fullDataUrl}" alt="Icon">`;
                globalPureBase64 = fullDataUrl.split(',')[1] || '';
            };
            reader.readAsDataURL(file);
        }
    }

    function initSavedConfig() {
        const host = window.location.hostname;
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        let defaultOwner = '', defaultRepo = '';
        if (host.endsWith('.github.io')) {
            defaultOwner = host.split('.')[0];
            defaultRepo = pathParts[0] || '';
        }
        document.getElementById('owner').value = localStorage.getItem('gh_owner') || defaultOwner;
        document.getElementById('repo').value = localStorage.getItem('gh_repo') || defaultRepo;
        document.getElementById('token').value = localStorage.getItem('gh_token') || '';
        if (!document.getElementById('token').value) {
            document.getElementById('config-panel').open = true;
        }
    }

    async function ghFetch(url, token, options = {}) {
        return fetch(url, {
            ...options,
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json',
                ...(options.headers || {})
            }
        });
    }

    async function startBuild() {
        const owner = document.getElementById('owner').value.trim();
        const repo = document.getElementById('repo').value.trim();
        const token = document.getElementById('token').value.trim();
        const targetUrl = document.getElementById('targetUrl').value.trim();
        const appName = document.getElementById('appName').value.trim();
        const appSuffix = document.getElementById('appSuffix').value.trim() || 'webtoapk';

        if (!owner || !repo || !token) {
            alert('請先展開頂部【首次使用配置】，填寫 GitHub 用戶名、倉庫名和 Token！');
            document.getElementById('config-panel').open = true;
            return;
        }
        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
            alert('網址必須以 http:// 或 https:// 開頭！');
            return;
        }

        localStorage.setItem('gh_owner', owner);
        localStorage.setItem('gh_repo', repo);
        localStorage.setItem('gh_token', token);

        const btn = document.getElementById('buildBtn');
        const statusCard = document.getElementById('statusCard');
        const statusTitle = document.getElementById('statusTitle');
        const progressFill = document.getElementById('progressFill');
        const stepList = document.getElementById('stepList');
        const downloadBtn = document.getElementById('downloadBtn');
        const backupLink = document.getElementById('backupLink');

        btn.disabled = true;
        statusCard.style.display = 'block';
        downloadBtn.style.display = 'none';
        backupLink.style.display = 'none';
        stepList.innerHTML = '';
        progressFill.style.width = '5%';

        try {
            const repoRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}`, token);
            if (!repoRes.ok) throw new Error('無法訪問倉庫，請檢查用戶名、倉庫名或 Token 是否正確');
            const repoData = await repoRes.json();
            const defaultBranch = repoData.default_branch || 'main';

            let existingLatestId = 0;
            try {
                const initialRunsRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs?per_page=1`, token);
                if (initialRunsRes.ok) {
                    const initialData = await initialRunsRes.json();
                    if (initialData.workflow_runs && initialData.workflow_runs.length > 0) {
                        existingLatestId = initialData.workflow_runs[0].id;
                    }
                }
            } catch(e) {}

            let hasCustomIcon = "false";
            if (globalPureBase64) {
                statusTitle.innerText = '📤 正在傳輸自定義圖標資源...';
                progressFill.style.width = '10%';
                
                let fileSha = undefined;
                try {
                    const getRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/contents/temp_icon.png?ref=${defaultBranch}`, token);
                    if (getRes.ok) {
                        const fileInfo = await getRes.json();
                        fileSha = fileInfo.sha;
                    }
                } catch(e) {}

                const putRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/contents/temp_icon.png`, token, {
                    method: 'PUT',
                    body: JSON.stringify({
                        message: 'upload temporary app icon',
                        content: globalPureBase64,
                        branch: defaultBranch,
                        sha: fileSha
                    })
                });

                if (putRes.ok) {
                    hasCustomIcon = "true";
                }
            }

            statusTitle.innerText = '⏳ 正在向 GitHub 發送構建指令...';
            progressFill.style.width = '15%';

            const dispatchRes = await ghFetch(
                `https://api.github.com/repos/${owner}/${repo}/actions/workflows/build.yml/dispatches`,
                token,
                {
                    method: 'POST',
                    body: JSON.stringify({
                        ref: defaultBranch,
                        inputs: {
                            target_url: targetUrl,
                            app_name: appName,
                            app_id_suffix: appSuffix,
                            has_custom_icon: hasCustomIcon
                        }
                    })
                }
            );

            if (!dispatchRes.ok) {
                const errText = await dispatchRes.text();
                throw new Error(`觸發編譯失敗 (${dispatchRes.status}): ${errText}`);
            }

            statusTitle.innerText = '🔄 已觸發雲端任務，正在等待 GitHub 分配排程...';
            progressFill.style.width = '20%';

            let runObj = null;
            for (let i = 0; i < 20; i++) {
                await new Promise(r => setTimeout(r, 3000));
                const runsRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs?per_page=5`, token);
                if (runsRes.ok) {
                    const runsData = await runsRes.json();
                    if (runsData.workflow_runs && runsData.workflow_runs.length > 0) {
                        const candidate = runsData.workflow_runs[0];
                        if (candidate.id > existingLatestId || candidate.status === 'queued' || candidate.status === 'in_progress') {
                            runObj = candidate;
                            break;
                        }
                    }
                }
            }

            if (!runObj) {
                throw new Error('任務排隊超時。請前往倉庫 Actions 頁面確認 GitHub 伺服器排程。');
            }

            const runId = runObj.id;
            const runNumber = runObj.run_number;
            while (true) {
                await new Promise(r => setTimeout(r, 4000));
                const jobsRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${runId}/jobs`, token);
                const jobsData = await jobsRes.json();
                const job = jobsData.jobs && jobsData.jobs[0];

                if (job && job.steps) {
                    const totalSteps = job.steps.length || 7;
                    const completedSteps = job.steps.filter(s => s.status === 'completed').length;
                    const percent = Math.min(95, Math.max(25, Math.round((completedSteps / totalSteps) * 100)));
                    progressFill.style.width = percent + '%';

                    const currentStep = job.steps.find(s => s.status === 'in_progress');
                    statusTitle.innerText = currentStep
                        ? `⚙️ 正在執行: ${currentStep.name} (${percent}%)`
                        : `⏳ 任務狀態: ${job.status}...`;

                    stepList.innerHTML = job.steps.map(s => {
                        let icon = '⚪';
                        if (s.status === 'in_progress') icon = '🔄';
                        else if (s.conclusion === 'success') icon = '✅';
                        else if (s.conclusion === 'failure') icon = '❌';
                        return `<li>${icon} ${s.name}</li>`;
                    }).join('');

                    if (job.status === 'completed') {
                        if (job.conclusion === 'success') {
                            progressFill.style.width = '100%';
                            statusTitle.innerText = '🎉 編譯成功！正在校驗 APK 下載資源...';
                            await fetchReleaseDetails(owner, repo, token, runNumber, downloadBtn, backupLink);
                        } else {
                            statusTitle.innerText = `❌ 編譯失敗 (${job.conclusion})，請前往倉庫查看詳細日誌`;
                        }
                        break;
                    }
                }
            }
        } catch (err) {
            statusTitle.innerText = '❌ 出错了: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    }

    async function fetchReleaseDetails(owner, repo, token, runNumber, downloadBtn, backupLink) {
        const expectedTag = `build-${runNumber}`;
        const statusTitle = document.getElementById('statusTitle');

        // 輪詢最多 20 次，每次 2 秒，總容錯時間 40 秒
        for (let i = 0; i < 20; i++) {
            statusTitle.innerText = `⏳ 正在連接雲端發布附件... (${i + 1}/20)`;

            // 策略 1：查詢所有 releases 列表第一筆
            try {
                const listRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/releases?per_page=3`, token);
                if (listRes.ok) {
                    const list = await listRes.json();
                    if (list && list.length > 0) {
                        const rel = list.find(r => r.tag_name === expectedTag) || list[0];
                        if (rel.assets && rel.assets.length > 0) {
                            const asset = rel.assets.find(a => a.name.endsWith('.apk')) || rel.assets[0];
                            if (asset && asset.id) {
                                showDownloadButton(asset, rel.id, rel.tag_name, downloadBtn);
                                return;
                            }
                        }
                    }
                }
            } catch(e) {}

            // 策略 2：按具體 tag 精確查詢
            try {
                const tagRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/releases/tags/${expectedTag}`, token);
                if (tagRes.ok) {
                    const relData = await tagRes.json();
                    if (relData.assets && relData.assets.length > 0) {
                        const asset = relData.assets.find(a => a.name.endsWith('.apk')) || relData.assets[0];
                        if (asset && asset.id) {
                            showDownloadButton(asset, relData.id, relData.tag_name, downloadBtn);
                            return;
                        }
                    }
                }
            } catch(e) {}

            await new Promise(r => setTimeout(r, 2000));
        }

        // 終極保底方案：手動連結
        const backupA = document.getElementById('backupA');
        backupA.href = `https://github.com/${owner}/${repo}/releases`;
        backupLink.style.display = 'block';
        statusTitle.innerText = '⚠️ 獲取下載連結超時，請點擊下方按鈕前往手動下載！';
    }

    function showDownloadButton(asset, relId, tagName, downloadBtn) {
        currentReleaseId = relId;
        currentTagName = tagName;
        targetAssetId = asset.id;
        rawDownloadUrl = asset.browser_download_url;

        let customName = document.getElementById('customFileName').value.trim();
        let fallbackName = document.getElementById('appName').value.trim() || 'app';
        let finalName = customName ? customName : fallbackName;
        if (!finalName.toLowerCase().endsWith('.apk')) {
            finalName += '.apk';
        }

        downloadBtn.innerText = `⬇️ 立即下載 ${finalName} (${(asset.size / 1024 / 1024).toFixed(2)} MB)`;
        downloadBtn.style.display = 'block';
        document.getElementById('statusTitle').innerText = '✅ APK 生成完畢，點擊按鈕即可一鍵下載！';
    }

    // 使用 GitHub Asset API 獲取二進制資料流，徹底解決 CORS 與自定義命名問題
    async function executeBlobDownload() {
        const owner = document.getElementById('owner').value.trim();
        const repo = document.getElementById('repo').value.trim();
        const token = document.getElementById('token').value.trim();
        const downloadBtn = document.getElementById('downloadBtn');
        const statusTitle = document.getElementById('statusTitle');

        if (!targetAssetId) return;

        let customName = document.getElementById('customFileName').value.trim();
        let fallbackName = document.getElementById('appName').value.trim() || 'app';
        let finalName = customName ? customName : fallbackName;
        if (!finalName.toLowerCase().endsWith('.apk')) {
            finalName += '.apk';
        }

        downloadBtn.disabled = true;
        downloadBtn.innerText = '⏳ 正在讀取安全加密數據流，請稍候...';
        statusTitle.innerText = '📥 正在從 GitHub 安全節點傳輸安裝包...';

        try {
            // 使用專屬的 API endpoint 下載附件，並透過 Accept: application/octet-stream 觸發二進制傳輸
            const assetApiUrl = `https://api.github.com/repos/${owner}/${repo}/releases/assets/${targetAssetId}`;
            const res = await fetch(assetApiUrl, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/octet-stream'
                }
            });

            if (!res.ok) {
                throw new Error(`下載被拒 (${res.status})，請確認 Token 權限`);
            }

            const blob = await res.blob();
            const blobUrl = window.URL.createObjectURL(blob);
            
            // 透過創建虛擬連結觸發本地儲存，完美繞過所有伺服器命名的限制
            const tempA = document.createElement('a');
            tempA.href = blobUrl;
            tempA.download = finalName;
            document.body.appendChild(tempA);
            tempA.click();
            document.body.removeChild(tempA);
            window.URL.revokeObjectURL(blobUrl);

            downloadBtn.innerText = '✨ 下載啟動完成！正在後台銷毀雲端記錄...';
            statusTitle.innerText = '🎉 安裝包已發送至本機，雲端痕跡將在 3 秒內徹底抹除。';

            // 確保檔案開始下載後，立即啟動閱後即焚
            setTimeout(async () => {
                if (currentReleaseId) {
                    try { await ghFetch(`https://api.github.com/repos/${owner}/${repo}/releases/${currentReleaseId}`, token, { method: 'DELETE' }); } catch(e) {}
                }
                if (currentTagName) {
                    try { await ghFetch(`https://api.github.com/repos/${owner}/${repo}/git/refs/tags/${currentTagName}`, token, { method: 'DELETE' }); } catch(e) {}
                }
                downloadBtn.innerText = '✅ 雲端記錄已完全銷毀';
            }, 3000);

        } catch (e) {
            console.error(e);
            alert('透過數據流下載失敗，將回退至常規下載模式。');
            downloadBtn.disabled = false;
            downloadBtn.innerText = '嘗試常規下載';
            downloadBtn.onclick = function() {
                window.open(rawDownloadUrl, '_blank');
            };
        }
    }
</script>
</body>
</html>
