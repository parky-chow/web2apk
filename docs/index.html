<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth</title>
    <style>
        :root { --primary: #2563eb; --success: #10b981; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #1e293b; margin: 0; padding: 30px 15px; display: flex; justify-content: center; align-items: center; min-height: 85vh; box-sizing: border-box; }
        
        /* 纯净无提示密码验证框样式 */
        .auth-box { width: 100%; max-width: 300px; background: var(--card); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 24px; box-sizing: border-box; }
        .auth-box input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; text-align: center; letter-spacing: 3px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .auth-box input:focus { border-color: var(--primary); }
        .auth-box input.error { border-color: #ef4444; animation: shake 0.3s; }
        .auth-box button { width: 100%; margin-top: 14px; padding: 11px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* 主界面样式（验证通过后才动态载入） */
        .container { width: 100%; max-width: 540px; background: var(--card); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 28px; box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; }
        .desc { font-size: 13px; color: #64748b; margin-bottom: 22px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
        input.form-input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; transition: border 0.2s; }
        input.form-input:focus { border-color: var(--primary); }
        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; margin-top: 8px; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-card { display: none; margin-top: 22px; padding: 18px; border-radius: 12px; background: #f1f5f9; border: 1px solid #e2e8f0; }
        .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin: 12px 0; }
        .progress-fill { height: 100%; width: 5%; background: var(--primary); transition: width 0.5s ease; }
        .step-list { font-size: 13px; color: #475569; margin: 10px 0 0 0; padding-left: 18px; line-height: 1.7; }
        .download-btn { display: none; width: 100%; text-align: center; padding: 13px; background: var(--success); color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; margin-top: 14px; box-sizing: border-box; }
        details { margin-bottom: 18px; background: #f8fafc; padding: 10px 14px; border-radius: 8px; border: 1px solid #e2e8f0; }
        summary { font-size: 13px; font-weight: 600; cursor: pointer; color: #475569; }
        .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
    </style>
</head>
<body>

<!-- 初始仅渲染无任何提示的密码框 -->
<div id="appRoot" style="width: 100%; display: flex; justify-content: center;">
    <div class="auth-box">
        <input type="password" id="pwdInput" autocomplete="off" autofocus onkeydown="if(event.key==='Enter') verifyAccess()">
        <button onclick="verifyAccess()">↵</button>
    </div>
</div>

<script>
    // 获取当前系统日期 8 位字符串 (YYYYMMDD)
    function getTodayCode() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}${m}${d}`;
    }

    // 验证密码并动态挂载网页内容
    function verifyAccess() {
        const inputEl = document.getElementById('pwdInput');
        if (!inputEl) return;
        
        if (inputEl.value.trim() === getTodayCode()) {
            renderMainApp();
        } else {
            inputEl.classList.remove('error');
            void inputEl.offsetWidth; // 触发抖动重绘
            inputEl.classList.add('error');
            inputEl.value = '';
        }
    }

    // 仅在验证通过后才将主界面注入 DOM
    function renderMainApp() {
        document.title = 'Web转APK 云端在线打包平台';
        document.body.style.alignItems = 'flex-start';
        const root = document.getElementById('appRoot');
        root.innerHTML = `
        <div class="container">
            <h2>📱 网页转 APK 在线生成台</h2>
            <p class="desc">输入目标网址与应用名称，由 GitHub Actions 云端实时编译并生成安卓安装包。</p>

            <details id="config-panel">
                <summary>⚙️ 首次使用配置 (GitHub 仓库与 Token，自动保存在本地浏览器)</summary>
                <div style="margin-top: 12px;">
                    <div class="row">
                        <div class="form-group">
                            <label>GitHub 用户名</label>
                            <input type="text" class="form-input" id="owner" placeholder="例如: zhangsan">
                        </div>
                        <div class="form-group">
                            <label>仓库名称 (Repo)</label>
                            <input type="text" class="form-input" id="repo" placeholder="例如: my-web-apk">
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>GitHub Personal Access Token (需勾选 workflow 权限)</label>
                        <input type="password" class="form-input" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                        <div class="hint">Token 仅保存在你当前浏览器的 localStorage 中，用于触发编译接口。</div>
                    </div>
                </div>
            </details>

            <div class="form-group">
                <label>🌐 目标网站地址 (必填，需带 http:// 或 https://)</label>
                <input type="url" class="form-input" id="targetUrl" placeholder="https://www.example.com" value="https://www.bing.com">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>🏷️ 手机桌面显示的 App 名称</label>
                    <input type="text" class="form-input" id="appName" placeholder="例如：我的商城" value="我的应用">
                </div>
                <div class="form-group">
                    <label>📦 唯一英文标识 (防覆盖安装)</label>
                    <input type="text" class="form-input" id="appSuffix" placeholder="纯字母，如 shopapp" value="myapp01">
                </div>
            </div>

            <button id="buildBtn" class="btn" onclick="startBuild()">🚀 开始云端编译 APK</button>

            <div id="statusCard" class="status-card">
                <div id="statusTitle" style="font-weight: 600; font-size: 14px;">正在请求云端构建服务器...</div>
                <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
                <ul id="stepList" class="step-list"></ul>
                <a id="downloadBtn" class="download-btn" href="#" target="_blank">⬇️ 立即下载编译好的 APK</a>
            </div>
        </div>`;

        initSavedConfig();
    }

    function initSavedConfig() {
        const host = window.location.hostname;
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        let defaultOwner = '', defaultRepo = '';
        if (host.endsWith('.github.io')) {
            defaultOwner = host.split('.')[0];
            defaultRepo = pathParts[0] || '';
        }
        document.getElementById('owner').value = localStorage.getItem('gh_owner') || defaultOwner;
        document.getElementById('repo').value = localStorage.getItem('gh_repo') || defaultRepo;
        document.getElementById('token').value = localStorage.getItem('gh_token') || '';
        if (!document.getElementById('token').value) {
            document.getElementById('config-panel').open = true;
        }
    }

    async function ghFetch(url, token, options = {}) {
        return fetch(url, {
            ...options,
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json',
                ...(options.headers || {})
            }
        });
    }

    async function startBuild() {
        const owner = document.getElementById('owner').value.trim();
        const repo = document.getElementById('repo').value.trim();
        const token = document.getElementById('token').value.trim();
        const targetUrl = document.getElementById('targetUrl').value.trim();
        const appName = document.getElementById('appName').value.trim();
        const appSuffix = document.getElementById('appSuffix').value.trim() || 'webtoapk';

        if (!owner || !repo || !token) {
            alert('请先展开顶部【首次使用配置】，填写 GitHub 用户名、仓库名和 Token！');
            document.getElementById('config-panel').open = true;
            return;
        }
        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
            alert('网址必须以 http:// 或 https:// 开头！');
            return;
        }

        localStorage.setItem('gh_owner', owner);
        localStorage.setItem('gh_repo', repo);
        localStorage.setItem('gh_token', token);

        const btn = document.getElementById('buildBtn');
        const statusCard = document.getElementById('statusCard');
        const statusTitle = document.getElementById('statusTitle');
        const progressFill = document.getElementById('progressFill');
        const stepList = document.getElementById('stepList');
        const downloadBtn = document.getElementById('downloadBtn');

        btn.disabled = true;
        statusCard.style.display = 'block';
        downloadBtn.style.display = 'none';
        stepList.innerHTML = '';
        progressFill.style.width = '8%';
        statusTitle.innerText = '⏳ 正在向 GitHub 发送构建指令...';

        try {
            const repoRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}`, token);
            if (!repoRes.ok) throw new Error('无法访问仓库，请检查用户名、仓库名或 Token 是否正确');
            const repoData = await repoRes.json();
            const defaultBranch = repoData.default_branch || 'main';

            const triggerTime = Date.now() - 5000;

            const dispatchRes = await ghFetch(
                `https://api.github.com/repos/${owner}/${repo}/actions/workflows/build.yml/dispatches`,
                token,
                {
                    method: 'POST',
                    body: JSON.stringify({
                        ref: defaultBranch,
                        inputs: {
                            target_url: targetUrl,
                            app_name: appName,
                            app_id_suffix: appSuffix
                        }
                    })
                }
            );

            if (!dispatchRes.ok) {
                const errText = await dispatchRes.text();
                throw new Error(`触发编译失败 (${dispatchRes.status}): ${errText}`);
            }

            statusTitle.innerText = '🔄 已触发云端任务，正在分配编译服务器...';
            progressFill.style.width = '15%';

            let runObj = null;
            for (let i = 0; i < 15; i++) {
                await new Promise(r => setTimeout(r, 3000));
                const runsRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs?event=workflow_dispatch&per_page=5`, token);
                const runsData = await runsRes.json();
                if (runsData.workflow_runs) {
                    runObj = runsData.workflow_runs.find(r => new Date(r.created_at).getTime() >= triggerTime);
                    if (runObj) break;
                }
            }

            if (!runObj) throw new Error('未检测到新启动的编译任务，请前往仓库 Actions 页面查看。');

            const runId = runObj.id;
            const runNumber = runObj.run_number;
            while (true) {
                await new Promise(r => setTimeout(r, 4000));
                const jobsRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${runId}/jobs`, token);
                const jobsData = await jobsRes.json();
                const job = jobsData.jobs && jobsData.jobs[0];

                if (job && job.steps) {
                    const totalSteps = job.steps.length || 7;
                    const completedSteps = job.steps.filter(s => s.status === 'completed').length;
                    const percent = Math.min(95, Math.max(20, Math.round((completedSteps / totalSteps) * 100)));
                    progressFill.style.width = percent + '%';

                    const currentStep = job.steps.find(s => s.status === 'in_progress');
                    statusTitle.innerText = currentStep
                        ? `⚙️ 正在执行: ${currentStep.name} (${percent}%)`
                        : `⏳ 任务状态: ${job.status}...`;

                    stepList.innerHTML = job.steps.map(s => {
                        let icon = '⚪';
                        if (s.status === 'in_progress') icon = '🔄';
                        else if (s.conclusion === 'success') icon = '✅';
                        else if (s.conclusion === 'failure') icon = '❌';
                        return `<li>${icon} ${s.name}</li>`;
                    }).join('');

                    if (job.status === 'completed') {
                        if (job.conclusion === 'success') {
                            progressFill.style.width = '100%';
                            statusTitle.innerText = '🎉 编译成功！正在获取 APK 直链...';
                            await fetchReleaseApk(owner, repo, token, runNumber, downloadBtn, runObj.html_url);
                        } else {
                            statusTitle.innerText = `❌ 编译失败 (${job.conclusion})，请点击查看日志`;
                        }
                        break;
                    }
                }
            }
        } catch (err) {
            statusTitle.innerText = '❌ 出错了: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    }

    async function fetchReleaseApk(owner, repo, token, runNumber, downloadBtn, fallbackUrl) {
        for (let i = 0; i < 5; i++) {
            const relRes = await ghFetch(`https://api.github.com/repos/${owner}/${repo}/releases/tags/build-${runNumber}`, token);
            if (relRes.ok) {
                const relData = await relRes.json();
                const asset = relData.assets && relData.assets[0];
                if (asset && asset.browser_download_url) {
                    downloadBtn.href = asset.browser_download_url;
                    downloadBtn.innerText = `⬇️ 立即下载 ${asset.name} (${(asset.size / 1024 / 1024).toFixed(2)} MB)`;
                    downloadBtn.style.display = 'block';
                    return;
                }
            }
            await new Promise(r => setTimeout(r, 2000));
        }
        downloadBtn.href = fallbackUrl;
        downloadBtn.innerText = '⬇️ 前往 GitHub Actions 页面下载 APK';
        downloadBtn.style.display = 'block';
    }
</script>
</body>
</html>
