name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '目標網站地址'
        required: true
        default: 'https://www.bing.com'
      app_name:
        description: '應用名稱'
        required: true
        default: '我的應用'
      app_id_suffix:
        description: '包名後綴 (純英文字母)'
        required: false
        default: 'webtoapk'
      has_custom_icon:
        description: '是否有自定義圖標'
        required: false
        default: 'false'
      custom_file_name:
        description: '自定義下載APK文件名'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出源碼 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 圖像處理庫 Pillow
        run: pip install Pillow

      - name: 3. 動態寫入配置與圖標強制覆蓋
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_SUFFIX: ${{ github.event.inputs.app_id_suffix }}
          HAS_ICON: ${{ github.event.inputs.has_custom_icon }}
        run: |
          python3 -c '
          import os, re, shutil
          from PIL import Image

          url = os.environ.get("TARGET_URL") or "https://www.bing.com"
          name = os.environ.get("APP_NAME") or "我的應用"
          suffix = re.sub(r"[^a-zA-Z0-9]", "", os.environ.get("APP_SUFFIX") or "webtoapk").lower() or "webtoapk"
          has_icon = os.environ.get("HAS_ICON") == "true"

          manifest_path = "app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              m_content = f.read()

          icon_temp_path = "temp_icon.png"
          if has_icon and os.path.exists(icon_temp_path):
              try:
                  img = Image.open(icon_temp_path).convert("RGBA")
                  min_dim = min(img.size)
                  left = (img.width - min_dim) / 2
                  top = (img.height - min_dim) / 2
                  img = img.crop((left, top, left + min_dim, top + min_dim))

                  sizes = {
                      "mipmap-mdpi": 48,
                      "mipmap-hdpi": 72,
                      "mipmap-xhdpi": 96,
                      "mipmap-xxhdpi": 144,
                      "mipmap-xxxhdpi": 192,
                      "drawable": 192,
                      "drawable-xhdpi": 96,
                      "drawable-xxhdpi": 144,
                      "drawable-xxxhdpi": 192
                  }
                  for folder, size in sizes.items():
                      dir_path = f"app/src/main/res/{folder}"
                      os.makedirs(dir_path, exist_ok=True)
                      resized = img.resize((size, size), Image.Resampling.LANCZOS)
                      resized.save(os.path.join(dir_path, "ic_launcher.png"))
                      resized.save(os.path.join(dir_path, "ic_launcher_round.png"))

                  anydpi_path = "app/src/main/res/mipmap-anydpi-v26"
                  if os.path.exists(anydpi_path):
                      shutil.rmtree(anydpi_path)

                  os.remove(icon_temp_path)
              except Exception as e:
                  print(f"圖標處理異常: {e}")

              m_content = re.sub(r"android:icon=\".*?\"", "android:icon=\"@mipmap/ic_launcher\"", m_content)
              m_content = re.sub(r"android:roundIcon=\".*?\"", "android:roundIcon=\"@mipmap/ic_launcher_round\"", m_content)
              if "android:icon=" not in m_content:
                  m_content = m_content.replace("<application", "<application android:icon=\"@mipmap/ic_launcher\" android:roundIcon=\"@mipmap/ic_launcher_round\"")

          m_content = re.sub(r"android:label=\".*?\"", f"android:label=\"{name}\"", m_content)
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(m_content)

          java_path = "app/src/main/java/com/example/webtoapk/MainActivity.java"
          with open(java_path, "r", encoding="utf-8") as f:
              c = f.read()
          c = re.sub(r"private static final String TARGET_URL = \".*?\";", f"private static final String TARGET_URL = \"{url}\";", c)
          with open(java_path, "w", encoding="utf-8") as f:
              f.write(c)

          gradle_path = "app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              c = f.read()
          c = re.sub(r"applicationId \"com\.example\..*?\"", f"applicationId \"com.example.{suffix}\"", c)
          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(c)
          '

      - name: 4. 配置 JDK 17 環境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 5. 配置 Gradle 8.5 編譯工具
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 6. 編譯並重命名 APK
        id: build_apk
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          CUSTOM_NAME: ${{ github.event.inputs.custom_file_name }}
        run: |
          gradle assembleDebug

          cat << 'EOF' > rename_apk.py
          import os, re, shutil

          app_name = os.environ.get("APP_NAME", "").strip() or "app"
          custom = os.environ.get("CUSTOM_NAME", "").strip()
          target_filename = custom if custom else f"{app_name}.apk"
          if not target_filename.lower().endsWith(".apk"):
              target_filename += ".apk"

          target_filename = re.sub(r'[\\/*?:"<>|]', '_', target_filename)

          src = "app/build/outputs/apk/debug/app-debug.apk"
          dst = os.path.join(".", target_filename)
          shutil.copyfile(src, dst)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"TARGET_APK={target_filename}\\n")
          EOF

          python3 rename_apk.py

      - name: 7. 發布到 Releases 生成下載附件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "${{ github.event.inputs.app_name || 'App' }} (構建 #${{ github.run_number }})"
          body: "目標網址: ${{ github.event.inputs.target_url }}"
          files: ./${{ env.TARGET_APK }}
