name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '目標網站地址'
        required: true
        default: 'https://www.bing.com'
      app_name:
        description: '應用名稱'
        required: true
        default: '我的應用'
      app_id_suffix:
        description: '包名後綴 (純英文字母)'
        required: true
        default: 'webtoapk'
      has_custom_icon:
        description: '是否有自定義圖標'
        required: true
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出源碼
        uses: actions/checkout@v4

      - name: 2. 安裝依賴
        run: pip install Pillow

      - name: 3. 核心配置注入
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_SUFFIX: ${{ github.event.inputs.app_id_suffix }}
          HAS_ICON: ${{ github.event.inputs.has_custom_icon }}
        run: |
          cat << 'EOF' > configure.py
          import os, re, shutil
          from PIL import Image

          url = os.environ.get("TARGET_URL") or "https://www.bing.com"
          name = os.environ.get("APP_NAME") or "我的應用"
          suffix = re.sub(r"[^a-zA-Z0-9]", "", os.environ.get("APP_SUFFIX") or "webtoapk").lower() or "webtoapk"
          has_icon = os.environ.get("HAS_ICON") == "true"

          icon_temp = "temp_icon.png"
          if has_icon and os.path.exists(icon_temp):
              try:
                  img = Image.open(icon_temp).convert("RGBA")
                  min_dim = min(img.size)
                  l, t = (img.width - min_dim) / 2, (img.height - min_dim) / 2
                  img = img.crop((l, t, l + min_dim, t + min_dim))
                  for folder, size in {"mipmap-mdpi":48, "mipmap-hdpi":72, "mipmap-xhdpi":96, "mipmap-xxhdpi":144, "mipmap-xxxhdpi":192, "drawable":192}.items():
                      d = f"app/src/main/res/{folder}"
                      os.makedirs(d, exist_ok=True)
                      img.resize((size, size), Image.Resampling.LANCZOS).save(f"{d}/ic_launcher.png")
                      img.resize((size, size), Image.Resampling.LANCZOS).save(f"{d}/ic_launcher_round.png")
                  if os.path.exists("app/src/main/res/mipmap-anydpi-v26"):
                      shutil.rmtree("app/src/main/res/mipmap-anydpi-v26")
                  os.remove(icon_temp)
              except: pass

          m_path = "app/src/main/AndroidManifest.xml"
          with open(m_path, "r", encoding="utf-8") as f: m = f.read()
          m = re.sub(r'android:label="[^"]*"', f'android:label="{name}"', m)
          if has_icon:
              m = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', m)
              m = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', m)
          with open(m_path, "w", encoding="utf-8") as f: f.write(m)

          j_path = "app/src/main/java/com/example/webtoapk/MainActivity.java"
          with open(j_path, "r", encoding="utf-8") as f: c = f.read()
          c = re.sub(r'private static final String TARGET_URL = "[^"]*";', f'private static final String TARGET_URL = "{url}";', c)
          with open(j_path, "w", encoding="utf-8") as f: f.write(c)

          g_path = "app/build.gradle"
          with open(g_path, "r", encoding="utf-8") as f: c = f.read()
          c = re.sub(r'applicationId "[^"]*"', f'applicationId "com.example.{suffix}"', c)
          with open(g_path, "w", encoding="utf-8") as f: f.write(c)
          EOF
          python3 configure.py

      - name: 4. JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 5. Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 6. 構建並發布
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_SUFFIX: ${{ github.event.inputs.app_id_suffix }}
        run: |
          gradle assembleDebug

          python3 -c '
          import os, re, shutil, subprocess
          suffix = re.sub(r"[^a-zA-Z0-9]", "", os.environ.get("APP_SUFFIX", "webtoapk")).lower() or "webtoapk"
          apk_name = f"{suffix}.apk"
          shutil.copy("app/build/outputs/apk/debug/app-debug.apk", apk_name)
          
          run_num = os.environ.get("GITHUB_RUN_NUMBER")
          tag = f"build-{run_num}"
          title = f"{os.environ.get('APP_NAME')} (構建 #{run_num})"
          
          subprocess.run(["gh", "release", "create", tag, apk_name, "-t", title, "-n", "Automated Web2APK"], check=True)
          '
